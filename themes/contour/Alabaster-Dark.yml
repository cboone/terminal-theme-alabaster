# Alabaster Dark theme for Contour
# Add this to your contour.yml under color_schemes:

alabaster_dark:
  default:
    background: '#2b2b2b'
    foreground: '#ececec'
  cursor:
    default: '#ececec'
    text: '#2b2b2b'
  selection:
    background: '#71b0ff'
    foreground: '#ececec'
  normal:
    black: '#2b2b2b'
    red: '#ff8884'
    green: '#cdea9e'
    yellow: '#ffc171'
    blue: '#71b0ff'
    magenta: '#d2a7ee'
    cyan: '#98e3ff'
    white: '#ececec'
  bright:
    black: '#777777'
    red: '#ff8a8a'
    green: '#d5f0a2'
    yellow: '#ffc880'
    blue: '#85b5ff'
    magenta: '#d9b3f0'
    cyan: '#b0e8ff'
    white: '#ffffff'
